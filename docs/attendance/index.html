<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보니또유 · 출퇴근 기록</title><link rel="stylesheet" href="./style.css?v=f6543f31574b"></head><body><main><header><div><p class="brand">BONITO.U</p><h1>출퇴근 기록</h1></div><button id="logout" hidden>로그아웃</button></header><section id="login-card"><h2>내 근무 기록 확인</h2><p>조회 비밀번호로 로그인해 주세요.</p><form id="login"><label for="password">조회 비밀번호</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button type="submit">기록 보기</button></form><p id="login-message" role="status"></p></section><section id="records-view" hidden><div class="report-top"><div><h2 id="month-title"></h2><p id="summary"></p></div><div class="controls"><button id="previous" aria-label="이전 달">이전 달</button><input id="month" type="month" aria-label="조회 월"><button id="next" aria-label="다음 달">다음 달</button></div></div><div class="sync"><p id="updated"></p><button id="refresh">새로고침</button></div><p id="message" role="status"></p><div class="weekdays" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div id="calendar" role="grid" aria-label="근무 달력"></div></section><footer>보니또유 · 조회 전용<span>기록 변경은 주 사용 PC에서 진행해 주세요.</span></footer></main><script src="./crypto.js?v=7c038c425013"></script><script src="./work.js?v=ebed2e2ccd32"></script><script src="./app.js?v=d9131c9abaa5"></script></body></html>
